# Expected behaviour of the pH front end, worked by hand from the schematic.
#
# J2 SIGNAL (BNC centre) -> R1 4.7M -> U2 + (C5 2.2n to GND). U2 (CA3140) is a non-inverting
# amplifier: R2 154k from U2_OUT to RV1 pin 1, RV1 pin 3 through R3 49.9k to GND, the wiper on
# U2 -, C6 1u from U2 - to U2_OUT. With the wiper at pos (0 = pin 3 end, 1 = pin 1 end):
#   Rtop = 154k + 5k (1 - pos), Rbot = 49.9k + 5k pos, G = 1 + Rtop/Rbot = 208.9k / Rbot,
# so RV1 sets the gain, not the offset: 3.805 (pos 1) .. 4.186 (pos 0, the cap). Mid-travel,
# the nominal setting: Rtop = 156.5k, Rbot = 52.4k, G = 3.9866. U4 (TL081H) is an inverting
# summer, + input at GND:
#   U4_OUT = -(R6/R4) U2_OUT - (R6/R5) V(-5V) = 0.4 |V(-5V)| - U2_OUT,
# to the Nano's A0 (PH_OUT, A1 pin 19) through R7 4.7k, with D2 (BAT54) from A0 to GND.
# PH_OUT = U4_OUT less R7 times D2's reverse leakage. D2 is the Nexperia BAT54 model
# (models/bat54.lib: IS = 2.117e-7, N = 1, RS = 2.7, beside 18 Mohm), so the leakage is
# VR / 18M + IS: 4.7k (1.9886 / 18M + 0.2117 uA) = 1.52 mV at pH 7, 1.0 .. 2.0 mV over the span.
#
# -5V: the TPS60400 is unregulated, -(5 V - Ro I) with Ro ~ 15 ohm (SLVS324C 8.3.1). The load is
# U4's model supply current 0.9375 mA + U2's 1.6 mA + R5's 5 V / 75k = 2.604 mA, so
# V(-5V) = -4.9609 V and the offset is 0.4 * 4.9609 = 1.9844 V.
#
# The probe is V3 behind R100 = 100 Mohm. U2's input current (10 pA, datasheet typ) drops
# 10 pA * (100M + 4.7M) = 1.047 mV, so U2 sees Vph - 1.047 mV:
#   U4_OUT = 1.9844 + 3.9866 * 1.047 mV - 3.9866 Vph = 1.9886 - 3.9866 Vph.
# Span: pH 0..14 over 0..60 C. The electrode gives 0.19841 mV/K per pH (54.20 mV/pH at 0 C,
# 59.16 at 25 C, 66.10 at 60 C), +/-7 pH about pH 7: +/-379.4, +/-414.1 and +/-462.7 mV.
# A0 at the nominal gain, pH 0 .. pH 14: 0.475 .. 3.499 V at 0 C, 0.337 .. 3.638 V at 25 C,
# 0.143 .. 3.831 V at 60 C; inside 0.1 .. 4.9 V. 235.8 mV/pH at 25 C: 48.3 counts/pH of the
# 10-bit 0-5 V ADC (44.2 at 0 C, 54.0 at 60 C), 676 counts for pH 0..14 at 25 C.
# The trim's cap: at maximum gain (4.186) A0 crosses 0 V at an EMF of
# 1.9844 / 4.1864 + 1.047 mV = 475.1 mV, above pH 0 at 60 C (462.7 mV): A0 = 0.051 V there.
#
# Clamp: with U4's output at V, I = (|V| - Vd) / 4.7k and Vd = Vt ln(I / IS + 1) + I RS
# (Vt = 25.865 mV at 27 C). At the -5V rail (V = -4.96 V, U4 saturated low): I = 1.008 mA,
# A0 = -0.2218 V; the data sheet's VF is at most 320 mV at 1 mA (BAT54, 1 July 2022, Table 7),
# so A0 stays above about -0.33 V on any part, inside the ATmega328P's -0.5 V pin limit, and
# D2 carries 1 mA of its 200 mA rating. 4.7k plus U4's output is under the 10 kohm source
# impedance the ATmega328P ADC is specified for.
#
# Absolute DC points carry the real parts' offset budget before calibration, as rtol:
# U4 VOS 4 mV max x noise gain 2.4 = 9.6 mV; U2 VIO 15 mV max x 3.9866 = 59.8 mV; U2 input
# current 50 pA max x 104.7M x 3.9866 = 20.9 mV; 90.3 mV in all. The bench lands inside it:
# the TL08xH model has its own -9.2 mV input offset on +/-5 V (-2.4 mV on +/-15 V), which
# puts PH_OUT 22 mV low. Gains (AC) and the time constant carry no offset: 1%.
# The over-range checks at 60 C use tighter rtols, wide enough for the model's -22 mV only:
# they check the design's nominal margins, not the parts' spread.
#
# U2 is NOT a vendor model: models/ca3140_datasheet.lib is a stand-in from the CA3140
# datasheet's typical values (no SPICE model on the Renesas product page). U4 is TI's
# TL07xH/TL08xH model (SLOM513A).
#
# The x200 copy (R201..U204) has RV201 at pos = 0, the R3 end: Rbot = 49.9k, G = 4.1864, and
# its own -5V (V4 + R103, the same 15 ohm), so each chain sees one pump's load.
# Its EMF comes through V5 = max(EMF, -0.5 V): below that its U4 would near its positive limit
# and the TL08xH model stops converging in the DC sweep. Above -0.5 V it follows the EMF exactly.

mirrors = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "C5", "C6", "RV1", "D2", "U2", "U4",
           "R201=R1", "R202=R2", "R203=R3", "R204=R4", "R205=R5", "R206=R6", "R207=R7",
           "C205=C5", "C206=C6", "RV201=RV1", "D202=D2", "U202=U2", "U204=U4",
           "R107=R7", "D102=D2"]

# DC: V3 (probe EMF) swept -0.6 .. +0.8 V.

# pH 7 (0 mV): 1.9886 V at U4, 1.9871 V at A0 after D2's 1.52 mV; rtol 0.0903 / 1.9871
[[measure]]
name = "a0_ph7"
analysis = "dc"
meas = "find v(/ph_out) at=0"
expect = 1.9871
rtol = 0.046

# pH 0 at 25 C (+414.1 mV): 1.9886 - 3.9866 * 0.41412 = 0.3376 V, 0.3365 V at A0; rtol 0.0903 / 0.3365
[[measure]]
name = "a0_ph0"
analysis = "dc"
meas = "find v(/ph_out) at=0.41412"
expect = 0.3365
rtol = 0.27

# pH 4 (+177.5 mV): 1.2810 V, 1.2797 V at A0; rtol 0.0903 / 1.2797
[[measure]]
name = "a0_ph4"
analysis = "dc"
meas = "find v(/ph_out) at=0.17748"
expect = 1.2797
rtol = 0.071

# pH 10 (-177.5 mV): 2.6961 V, 2.6944 V at A0; rtol 0.0903 / 2.6944
[[measure]]
name = "a0_ph10"
analysis = "dc"
meas = "find v(/ph_out) at=-0.17748"
expect = 2.6944
rtol = 0.034

# pH 14 at 25 C (-414.1 mV): 3.6395 V, 3.6376 V at A0; rtol 0.0903 / 3.6376
[[measure]]
name = "a0_ph14"
analysis = "dc"
meas = "find v(/ph_out) at=-0.41412"
expect = 3.6376
rtol = 0.025

# U2 input at 0 V EMF: -10 pA * 104.7 Mohm = -1.047 mV (the stand-in's input current)
[[measure]]
name = "u2_in_bias"
analysis = "dc"
meas = "find v(/u2_in) at=0"
expect = -1.047e-3
rtol = 0.01

# -5V rail: -(5 - 15 * 2.604 mA) = -4.9609 V
[[measure]]
name = "rail_m5v"
analysis = "dc"
meas = "find v(/-5v) at=0"
expect = -4.9609
rtol = 0.002

# Informational: U4's inverting input at 0 V EMF, about -VOS of the TL08xH model on +/-5 V
[[measure]]
name = "u4_vn"
analysis = "dc"
meas = "find v(/u4_n) at=0"

# Over-range, nominal gain: pH 0 at 60 C (+462.7 mV): 1.9886 - 3.9866 * 0.46273 = 0.1438 V,
# 0.1428 V at A0. rtol 0.2 holds it in 0.114 .. 0.171 V (the model puts it 22 mV low): above 0.1 V.
[[measure]]
name = "a0_ph0_60c"
analysis = "dc"
meas = "find v(/ph_out) at=0.46273"
expect = 0.1428
rtol = 0.2

# Over-range, nominal gain: pH 14 at 60 C (-462.7 mV): 3.8333 V, 3.8313 V at A0 (below 4.9 V)
[[measure]]
name = "a0_ph14_60c"
analysis = "dc"
meas = "find v(/ph_out) at=-0.46273"
expect = 3.8313
rtol = 0.02

# Informational: pH 0 and pH 14 at 0 C (+/-379.4 mV): by hand 0.4750 V and 3.4991 V
[[measure]]
name = "a0_ph0_0c"
analysis = "dc"
meas = "find v(/ph_out) at=0.37937"

[[measure]]
name = "a0_ph14_0c"
analysis = "dc"
meas = "find v(/ph_out) at=-0.37937"

# Over-range, maximum gain: A0 crosses 0 V at Vph = 1.9844 / 4.1864 + 1.047 mV = 475.1 mV.
# rtol 0.02 keeps it above 465.6 mV, so above pH 0 at 60 C (462.7 mV); the model's -22 mV
# moves it 5.3 mV lower (1.1%).
[[measure]]
name = "a0_zero_emf_max"
analysis = "dc"
meas = "when v(/ph_out_200)=0"
expect = 0.47506
rtol = 0.02

# Informational: pH 0 at 60 C at maximum gain: by hand 0.0508 V (the model puts it 22 mV lower)
[[measure]]
name = "a0_ph0_60c_max"
analysis = "dc"
meas = "find v(/ph_out_200) at=0.46273"

# Over-range, maximum gain: pH 14 at 60 C: 1.9844 + 4.1864 * (0.46273 + 1.047 mV) = 3.9259 V,
# 3.9239 V at A0 (below 4.9 V)
[[measure]]
name = "a0_ph14_60c_max"
analysis = "dc"
meas = "find v(/ph_out_200) at=-0.46273"
expect = 3.9239
rtol = 0.02

# Informational: U2's ceiling at maximum gain (stand-in: V+ - 2.0 V less a clamp-diode drop;
# datasheet VOM+ = V+ - 2 V typ, so about 3.0 V)
[[measure]]
name = "u2_ceiling_max"
analysis = "dc"
meas = "max v(/u2_out_200)"

# A0 with U2 at its ceiling (+800 mV: 4.1864 * 0.8 = 3.35 V asked of U2), as with the probe
# unplugged once U2's input drifts high: U4_OUT = 1.9844 - 3.029 (the stand-in's ceiling)
# - 22 mV (the TL08xH model's offset) = -1.067 V, which R7 and D2 clamp: I = 0.190 mA,
# A0 = -0.1763 V.
[[measure]]
name = "a0_u2_ceiling"
analysis = "dc"
meas = "find v(/ph_out_200) at=0.8"
expect = -0.1763
rtol = 0.03

# Fault: A0 with U4's output held at the -5V rail (V6 = -4.96 V into R107, D102): -0.2218 V
[[measure]]
name = "fault_a0"
analysis = "dc"
meas = "find v(/a0_fault) at=0"
expect = -0.2218
rtol = 0.02

# Fault: clamp current through R107 and D102 into V6's + terminal: 1.008 mA
[[measure]]
name = "fault_clamp_current"
analysis = "dc"
meas = "find i(v6) at=0"
expect = 1.0081e-3
rtol = 0.01

# TRAN: V3 steps 0 -> 0.1 V at 0.1 s. Input time constant tau = (R100 + R1) C5 = 230.3 ms;
# C6 adds Rtop C6 = 156.5 ms on U2 (both settled by 2.9 s).

# Before the step: U2_OUT = -3.9866 * 1.047 mV = -4.174 mV
[[measure]]
name = "tran_u2_before"
analysis = "tran"
meas = "find v(/u2_out) at=0.09"
expect = -4.174e-3
rtol = 0.02

# One tau after the step: U2_IN = 0.1 (1 - e^-1) - 1.047 mV = 62.17 mV
[[measure]]
name = "tran_u2_in_tau"
analysis = "tran"
meas = "find v(/u2_in) at=0.33034"
expect = 0.06217
rtol = 0.01

# Settled: U2_OUT = 3.9866 * (0.1 - 1.047 mV) = 0.39449 V
[[measure]]
name = "tran_u2_settled"
analysis = "tran"
meas = "find v(/u2_out) at=2.9"
expect = 0.39449
rtol = 0.01

# AC about 0 V EMF.

# Small-signal gains at 1 mHz (ngspice 44.2 has no deriv in a dc meas), about 0 V EMF.
# |PH_OUT / Vph| = G = 208.9k / 52.4k = 3.9866
[[measure]]
name = "ac_gain_lo"
analysis = "ac"
meas = "find vm(/ph_out) at=0.001"
expect = 3.9866
rtol = 0.01

# U2 stage alone: |U2_OUT / Vph| = 3.9866
[[measure]]
name = "ac_u2_gain_lo"
analysis = "ac"
meas = "find vm(/u2_out) at=0.001"
expect = 3.9866
rtol = 0.01

# Maximum gain (RV201 at the R3 end): |U2_OUT_200 / Vph| = 208.9k / 49.9k = 4.1864
[[measure]]
name = "ac_u2_gain_max"
analysis = "ac"
meas = "find vm(/u2_out_200) at=0.001"
expect = 4.1864
rtol = 0.01

# -3 dB: 3.9866 / sqrt(2) = 2.8190. The input pole 1 / (2 pi (R100 + R1) C5) = 0.6910 Hz and
# C6's shelf (below) together put it at 0.5333 Hz. Without the probe's 100 Mohm the R1 C5 pole
# is at 15.39 Hz; with 1 Gohm, 0.072 Hz.
[[measure]]
name = "ac_f3db"
analysis = "ac"
meas = "when vm(/ph_out)=2.8190 fall=1"
expect = 0.5333
rtol = 0.02

# C6 shelf: U2's gain falls from 3.9866 to 1 between the pole 1 / (2 pi Rtop C6) = 1.017 Hz and
# the zero (Rtop + Rbot) / (2 pi Rtop Rbot C6) = 4.054 Hz. At 1 kHz:
# |U2_OUT / Vph| = |1 / (1 + j f / 0.691)| * |1 + 2.9866 / (1 + j f / 1.017)| = 6.910e-4
[[measure]]
name = "ac_u2_1khz"
analysis = "ac"
meas = "find vm(/u2_out) at=1k"
expect = 6.910e-4
rtol = 0.02

# U2 input at 1 kHz: |1 / (1 + j f / 0.691)| = 6.910e-4
[[measure]]
name = "ac_u2_in_1khz"
analysis = "ac"
meas = "find vm(/u2_in) at=1k"
expect = 6.910e-4
rtol = 0.01

# Informational: highest |PH_OUT / Vph| anywhere (no peaking expected: 3.9866 at DC)
[[measure]]
name = "ac_peak"
analysis = "ac"
meas = "max vm(/ph_out)"
