# Expected behaviour of the pH front end, worked by hand from the schematic.
#
# J2 SIGNAL (BNC centre) -> R1 4.7M -> U2 + (C5 2.2n to GND). U2 (CA3140) is a non-inverting
# amplifier: R2 2.2k from U2_OUT to RV1 pin 1, RV1 pin 3 through R3 1k to GND, the wiper on
# U2 -, C6 1u from U2 - to U2_OUT. With the wiper at pos (0 = pin 3 end, 1 = pin 1 end):
#   Rtop = 2.2k + 5k (1 - pos), Rbot = 1k + 5k pos, G = 1 + Rtop/Rbot = 8.2k / Rbot,
# so RV1 sets the gain (1.367 .. 8.2), not the offset. Mid-travel: Rtop = 4.7k, Rbot = 3.5k,
# G = 2.3429. U4 (TL081H) is an inverting summer, + input at GND:
#   PH_OUT = -(R6/R4) U2_OUT - (R6/R5) V(-5V) = 0.4 |V(-5V)| - U2_OUT,
# straight to the Nano's A0 (A1 pin 19).
#
# -5V: the TPS60400 is unregulated, -(5 V - Ro I) with Ro ~ 15 ohm (SLVS324C 8.3.1). The load is
# U4's model supply current 0.9375 mA + U2's 1.6 mA + R5's 5 V / 75k = 2.604 mA, so
# V(-5V) = -4.9609 V and the offset is 0.4 * 4.9609 = 1.9844 V.
#
# The probe is V3 behind R100 = 100 Mohm. U2's input current (10 pA, datasheet typ) drops
# 10 pA * (100M + 4.7M) = 1.047 mV, so U2 sees Vph - 1.047 mV:
#   PH_OUT = 1.9844 + 2.3429 * 1.047 mV - 2.3429 Vph = 1.9868 - 2.3429 Vph.
# pH 0..14 at 25 C is +414.1 .. -414.1 mV (59.16 mV/pH), so A0 reads 1.017 V (pH 0) to
# 2.957 V (pH 14): 1.940 V, 397 counts of the 10-bit 0-5 V ADC, 28.4 counts/pH.
#
# Absolute DC points carry the real parts' offset budget before calibration, as rtol:
# U4 VOS 4 mV max x noise gain 2.4 = 9.6 mV; U2 VIO 15 mV max x 2.3429 = 35.1 mV; U2 input
# current 50 pA max x 104.7M x 2.3429 = 12.3 mV; 57 mV in all. The bench lands inside it:
# the TL08xH model has its own -9.2 mV input offset on +/-5 V (-2.4 mV on +/-15 V), which
# puts PH_OUT 22 mV low. Gains (AC) and the time constant carry no offset: 1%.
#
# U2 is NOT a vendor model: models/ca3140_datasheet.lib is a stand-in from the CA3140
# datasheet's typical values (no SPICE model on the Renesas product page). U4 is TI's
# TL07xH/TL08xH model (SLOM513A).
#
# The x200 copy (R201..U204) has RV201 at pos = 0, the R3 end: Rbot = 1k, G = 8.2, and its own
# -5V (V4 + R103, the same 15 ohm), so each chain sees one pump's load.
# Its EMF comes through V5 = max(EMF, -0.2 V): below that its U4 would saturate high and the
# TL08xH model stops converging in the DC sweep. Above -0.2 V it follows the EMF exactly.

mirrors = ["R1", "R2", "R3", "R4", "R5", "R6", "C5", "C6", "RV1", "U2", "U4",
           "R201=R1", "R202=R2", "R203=R3", "R204=R4", "R205=R5", "R206=R6",
           "C205=C5", "C206=C6", "RV201=RV1", "U202=U2", "U204=U4"]

# DC: V3 (probe EMF) swept -0.6 .. +0.6 V.

# pH 7 (0 mV): 1.9868 V; rtol 0.057 / 1.9868
[[measure]]
name = "a0_ph7"
analysis = "dc"
meas = "find v(/ph_out) at=0"
expect = 1.9868
rtol = 0.029

# pH 0 (+414.1 mV): 1.9868 - 2.3429 * 0.41412 = 1.0166 V; rtol 0.057 / 1.0166
[[measure]]
name = "a0_ph0"
analysis = "dc"
meas = "find v(/ph_out) at=0.41412"
expect = 1.0166
rtol = 0.057

# pH 4 (+177.5 mV): 1.5710 V; rtol 0.057 / 1.5710
[[measure]]
name = "a0_ph4"
analysis = "dc"
meas = "find v(/ph_out) at=0.17748"
expect = 1.5710
rtol = 0.037

# pH 10 (-177.5 mV): 2.4026 V; rtol 0.057 / 2.4026
[[measure]]
name = "a0_ph10"
analysis = "dc"
meas = "find v(/ph_out) at=-0.17748"
expect = 2.4026
rtol = 0.024

# pH 14 (-414.1 mV): 2.9571 V; rtol 0.057 / 2.9571
[[measure]]
name = "a0_ph14"
analysis = "dc"
meas = "find v(/ph_out) at=-0.41412"
expect = 2.9571
rtol = 0.02

# U2 input at 0 V EMF: -10 pA * 104.7 Mohm = -1.047 mV (the stand-in's input current)
[[measure]]
name = "u2_in_bias"
analysis = "dc"
meas = "find v(/u2_in) at=0"
expect = -1.047e-3
rtol = 0.01

# -5V rail: -(5 - 15 * 2.604 mA) = -4.9609 V
[[measure]]
name = "rail_m5v"
analysis = "dc"
meas = "find v(/-5v) at=0"
expect = -4.9609
rtol = 0.002

# Informational: U4's inverting input at 0 V EMF, about -VOS of the TL08xH model on +/-5 V
[[measure]]
name = "u4_vn"
analysis = "dc"
meas = "find v(/u4_n) at=0"

# Informational: pH 0 and pH 14 at 60 C (66.10 mV/pH, +/-462.7 mV): by hand 0.903 V and 3.071 V
[[measure]]
name = "a0_ph0_60c"
analysis = "dc"
meas = "find v(/ph_out) at=0.46273"

[[measure]]
name = "a0_ph14_60c"
analysis = "dc"
meas = "find v(/ph_out) at=-0.46273"

# Maximum gain: A0 crosses 0 V at Vph = 1.9844 / 8.2 + 1.047 mV = 243.0 mV (pH 2.89);
# below pH 2.89, A0 goes negative. rtol covers the model's 22 mV offset (/8.2 = 2.7 mV, 1.1%).
[[measure]]
name = "a0_zero_emf_max"
analysis = "dc"
meas = "when v(/ph_out_200)=0"
expect = 0.2430
rtol = 0.02

# Informational: U2's ceiling at maximum gain (stand-in: V+ - 2.0 V less a clamp-diode drop;
# datasheet VOM+ = V+ - 2 V typ, so about 3.0 V)
[[measure]]
name = "u2_ceiling_max"
analysis = "dc"
meas = "max v(/u2_out_200)"

# Informational: A0 with U2 at its ceiling (max gain, +600 mV): 1.9844 - 3.0 = about -1.0 V.
# The same happens at any gain with the probe unplugged if U2 drifts to its positive limit.
[[measure]]
name = "a0_u2_ceiling"
analysis = "dc"
meas = "find v(/ph_out_200) at=0.6"

# TRAN: V3 steps 0 -> 0.1 V at 0.1 s. Input time constant tau = (R100 + R1) C5 = 230.3 ms.

# Before the step: U2_OUT = -2.3429 * 1.047 mV = -2.453 mV
[[measure]]
name = "tran_u2_before"
analysis = "tran"
meas = "find v(/u2_out) at=0.09"
expect = -2.453e-3
rtol = 0.02

# One tau after the step: U2_IN = 0.1 (1 - e^-1) - 1.047 mV = 62.17 mV
[[measure]]
name = "tran_u2_in_tau"
analysis = "tran"
meas = "find v(/u2_in) at=0.33034"
expect = 0.06217
rtol = 0.01

# Settled (12 tau): U2_OUT = 2.3429 * (0.1 - 1.047 mV) = 0.23183 V
[[measure]]
name = "tran_u2_settled"
analysis = "tran"
meas = "find v(/u2_out) at=2.9"
expect = 0.23183
rtol = 0.01

# AC about 0 V EMF.

# Small-signal gains at 1 mHz (ngspice 44.2 has no deriv in a dc meas), about 0 V EMF.
# |PH_OUT / Vph| = G = 8.2k / 3.5k = 2.3429
[[measure]]
name = "ac_gain_lo"
analysis = "ac"
meas = "find vm(/ph_out) at=0.001"
expect = 2.3429
rtol = 0.01

# U2 stage alone: |U2_OUT / Vph| = 2.3429
[[measure]]
name = "ac_u2_gain_lo"
analysis = "ac"
meas = "find vm(/u2_out) at=0.001"
expect = 2.3429
rtol = 0.01

# Maximum gain (RV201 at the R3 end): |U2_OUT_200 / Vph| = 8.2k / 1k = 8.2
[[measure]]
name = "ac_u2_gain_max"
analysis = "ac"
meas = "find vm(/u2_out_200) at=0.001"
expect = 8.2
rtol = 0.01

# -3 dB: 2.3429 / sqrt(2) = 1.6567, at 1 / (2 pi (R100 + R1) C5) = 0.6910 Hz (0.6907 with C6's
# shelf). Without the probe's 100 Mohm the R1 C5 pole is at 15.39 Hz; with 1 Gohm, 0.072 Hz.
[[measure]]
name = "ac_f3db"
analysis = "ac"
meas = "when vm(/ph_out)=1.6567 fall=1"
expect = 0.6907
rtol = 0.02

# C6 shelf: U2's gain falls from 2.3429 to 1 between the pole 1 / (2 pi Rtop C6) = 33.86 Hz and
# the zero (Rtop + Rbot) / (2 pi Rtop Rbot C6) = 79.34 Hz. At 1 kHz:
# |U2_OUT / Vph| = |1 / (1 + j f / 0.691)| * |1 + 1.3429 / (1 + j f / 33.86)| = 6.927e-4
[[measure]]
name = "ac_u2_1khz"
analysis = "ac"
meas = "find vm(/u2_out) at=1k"
expect = 6.927e-4
rtol = 0.02

# U2 input at 1 kHz: |1 / (1 + j f / 0.691)| = 6.910e-4
[[measure]]
name = "ac_u2_in_1khz"
analysis = "ac"
meas = "find vm(/u2_in) at=1k"
expect = 6.910e-4
rtol = 0.01

# Informational: highest |PH_OUT / Vph| anywhere (no peaking expected: 2.3429 at DC)
[[measure]]
name = "ac_peak"
analysis = "ac"
meas = "max vm(/ph_out)"
